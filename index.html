<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Calendrier de l'Avent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mon Calendrier de l'Avent</h1>
        <p>Cliquez sur les cases du jour pour découvrir les surprises !</p>
    </header>

    <main>
        <!-- Le conteneur du sapin -->
        <div class="tree-container">
            <!-- Les 24 cases (générées ou écrites en dur) -->
            <!-- Exemple pour quelques cases -->
            <div class="door" data-day="1">
                <span class="number">1</span>
                <div class="content">
                    <a href="https://example.com/lien-1" target="_blank">Surprise 1 🎁</a>
                </div>
            </div>
            <div class="door" data-day="2">
                <span class="number">2</span>
                <div class="content">
                    <a href="https://example.com/lien-2" target="_blank">Surprise 2 🎄</a>
                </div>
            </div>
            <!-- Répétez l'opération jusqu'au 24 -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
